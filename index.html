<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Print Tracker</title>
        <meta name="description" content="A web-based 3D print tracker that automatically deducts filament and tracks total usage/cost.">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="css/styles.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    </head>
    <body>
        <!--[if lt IE 7]>
            <p class="browsehappy">You are using an <strong>outdated</strong> browser. Please <a href="#">upgrade your browser</a> to improve your experience.</p>
        <![endif]-->
        
        <div id="header">
            <!-- Multipage Header Section -->
        </div>
        <div id="dashboard">
            <!-- Dashboard Section -->
            <p>Dashboard</p>
        </div>
        <div id="prints">
            <!-- Prints Section
                contains print info, saved to localStorage 
            -->
            <p>Prints</p>
        </div>
        <div id="filament">
            <!-- Filament Manager Section -->
            <p>Filament</p>
        </div>
        <div id="queue">
            <!-- Print Queue Section -->
            <p>Print Queue</p>
        </div>
        <div id="data">
            <!-- Data Export Section -->
            <p>Data Export</p>
        </div>

        <script src="js/main.js" type="module"></script>
