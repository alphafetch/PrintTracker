<!DOCTYPE html>
<!--[if lt IE 7]>      <html class="no-js lt-ie9 lt-ie8 lt-ie7"> <![endif]-->
<!--[if IE 7]>         <html class="no-js lt-ie9 lt-ie8"> <![endif]-->
<!--[if IE 8]>         <html class="no-js lt-ie9"> <![endif]-->
<!--[if gt IE 8]>      <html class="no-js"> <!--<![endif]-->
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Print Tracker</title>
        <meta name="description" content="A web-based 3D print tracker that automatically deducts filament and tracks total usage/cost.">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="css/styles.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    </head>
    <body>
        <!--[if lt IE 7]>
            <p class="browsehappy">You are using an <strong>outdated</strong> browser. Please <a href="#">upgrade your browser</a> to improve your experience.</p>
        <![endif]-->
        
        <div id="header">
            <!-- Multipage Header Section -->
        </div>
        <div id="dashboard" class="section">
            <!-- Dashboard Section -->
            <h2 class="headers section-header">Dashboard</h2>
        </div>
        <div id="prints" class="section">
            <!-- Prints Section
                contains print info, saved to localStorage 
            -->
            <h2 class="headers section-header">Prints</h2>

            <div id="print-popup" class="popup">
                <div class="popup-content">
                    <h3 class="headers mono-imp no-pad top-mar-off">Create Print</h3>
                    <p class="body-text no-pad bolden">Name:</p>
                    <input type="text" spellcheck="false" id="name-tinput" class="text-input" placeholder="e.g., Plate Scraper"> <br>
                    <p class="body-text no-pad bolden">Date:</p>
                    <input type="date" spellcheck="false" id="date-tinput" class="date-input" required> <br>
                    <p class="body-text no-pad bolden">Link:</p>
                    <input type="text" spellcheck="false" id="link-tinput" class="text-input"> <br>
                    <p class="body-text no-pad bolden">Result:</p>
                    <label for="result-rinput1" class="body-text no-pad">Success</label>
                    <input type="radio" name="result-rinput" id="result-rinput1" class="radio-input"> <br> 
                    <label for="result-rinput2" class="body-text no-pad">Failure</label>
                    <input type="radio" name="result-rinput" id="result-rinput2" class="radio-input mar-off"> <br>
                    <p class="body-text no-pad bolden">Filament Used:</p>
                    <div id="filament-rows" class="card">
                        <template id="filament-row-template">
                            <div class="card inline-row">
                                <select name="spool-select" class="spool-select dropdown">
                                    <!-- User's filaments will go here -->
                                </select>
                                <input type="number" min="0" class="filament-selector-input text-input" placeholder="e.g., 5">
                            </div>
                        </template>
                        <!-- Filament rows go here -->
                    </div>

                    <br>
                    <button id="add-print-button" class="buttons-filled inline-button">Create Print</button>
                    <button id="cancel-print-button" class="buttons-empty inline-button">Cancel</button>
                </div>
            </div>
        </div>
        <div id="filament" class="section">
            <!-- Filament Manager Section -->
            <div class="section-top">
                <h2 class="headers section-header">Filament</h2>
                <label for="hide-archived" class="warn-text no-pad pad-right right-align-block">Hide archived</label>
                <input type="checkbox" class="radio-input right-align-block" name="hide-archived" id="archive-off-checkbox">
            </div>

            <div id="filament-add-popup" class="popup">
                <div id="filament-add-popup-content" class="popup-content">
                    <h3 class="headers mono-imp no-pad top-mar-off">Add Spool</h3>
                    <p class="body-text no-pad bolden">Brand:</p>
                    <input type="text" spellcheck="false" id="brand-tinput" class="text-input" placeholder="e.g., Bambu Lab"> <br>
                    <p class="body-text no-pad bolden">Material:</p>
                    <select name="material-dropdown" id="material-dropdown" class="dropdown">
                        <option value="pla" class="option-input">PLA</option>
                        <option value="petg" class="option-input">PETG</option>
                        <option value="abs" class="option-input">ABS</option>
                        <option value="asa" class="option-input">ASA</option>
                        <option value="tpu" class="option-input">TPU</option>
                        <option value="other" class="option-input">Other</option>
                    </select>
                    <p class="body-text no-pad bolden">Color:</p>
                    <input type="text" spellcheck="false" id="color-tinput" class="text-input" placeholder="e.g., Black">
                    <p class="body-text no-pad bolden">Weight (grams):</p>
                    <input type="number" id="grams-ninput" class="number-input" min="0" step="0.01" placeholder="e.g., 370">
                    <p class="body-text no-pad bolden">Price:</p>
                    <input type="number" id="price-ninput" class="number-input" min="0" step="0.01" placeholder="e.g., $9.57">
                    <p class="body-text no-pad bolden">Date:</p>
                    <input type="date" spellcheck="false" id="date-dinput" class="date-input" required> <br>

                    <br>
                    <button id="add-spool-button" class="buttons-filled inline-button">Add Spool</button>
                    <button id="cancel-spool-button" class="buttons-empty inline-button">Cancel</button>
                </div>
            </div>
        </div>
        <div id="queue" class="section">
            <!-- Print Queue Section -->
            <h2 class="headers section-header">Print Queue</h2>
        </div>
        <div id="data" class="section">
            <!-- Data Export Section -->
            <h2 class="headers section-header">Data Export</h2>
        </div>

        <script src="js/main.js" type="module"></script>
    </body>
</html>
